<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Photo Studio</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--cd:#16171b;--ln:#26282f;--tx:#f2f2f4;--mu:#8d909c;--ac:#ff7a1a;--gn:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.tab{display:none;flex:1;min-height:0;overflow:auto}.tab.on{display:flex;flex-direction:column}
nav{display:flex;border-top:1px solid var(--ln);background:#0c0d10;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font:inherit;font-size:12px}
nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:20px}
button,select{font:inherit;color:var(--tx);cursor:pointer}
/* CAMERA (Oppo 60%) */
.vf{position:relative;flex:1;min-height:300px;background:#000;overflow:hidden;max-width:560px;width:100%;margin:0 auto}
.vf video,.vf canvas.fx,.vf canvas.demo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pill{background:#0008;border:0;border-radius:20px;padding:6px 12px;font-size:12px;backdrop-filter:blur(8px)}
.sug{position:absolute;left:50%;top:46px;transform:translateX(-50%);background:#ff7a1acc;color:#190a00;font-weight:600;border-radius:20px;padding:5px 14px;font-size:13px;z-index:3;white-space:nowrap;transition:.2s}
.sug.ok{background:#34d399cc}
.lens{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;z-index:3}
.lens button{width:38px;height:38px;border-radius:50%;background:#0009;border:1px solid #fff3;font-size:12px}
.lens button.on{color:var(--ac);border-color:var(--ac);transform:scale(1.12)}
.ctrl{max-width:560px;width:100%;margin:0 auto;background:#000;padding:6px 14px 10px}
.modes{display:flex;justify-content:center;gap:20px;color:var(--mu);margin-bottom:8px}
.modes b{font-weight:500;cursor:pointer;padding:2px 0}.modes b.on{color:var(--ac);border-bottom:2px solid var(--ac)}
.shutrow{display:flex;align-items:center;justify-content:space-between}
.thumb{width:48px;height:48px;border-radius:12px;background:#222 center/cover;border:1px solid var(--ln)}
.shut{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:none;padding:4px}.shut i{display:block;width:100%;height:100%;border-radius:50%;background:#fff}.shut:active i{transform:scale(.88)}
.flip{width:48px;height:48px;border-radius:50%;background:#1c1d22;border:0;font-size:20px}
.pro{display:none;background:#000;border-top:1px solid var(--ln);padding:8px 14px;max-width:560px;margin:0 auto;width:100%}.pro.on{display:block}
.pro .sl{display:grid;grid-template-columns:62px 1fr 56px;gap:8px;align-items:center;font:11px ui-monospace,monospace;color:var(--mu);margin:3px 0}
.pro .sl output{color:var(--gn);text-align:right}
#hist{width:100%;height:42px;background:#0a0a0c;border:1px solid var(--ln);border-radius:6px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--ac)}
/* GALLERY (Google Photos 5%) */
.gh{padding:12px 14px;display:flex;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:2}
.gh h2{margin:0;font-size:20px;flex:1;font-weight:500}
.gb{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-size:12px}
.day{padding:10px 14px 4px;color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:3px;padding:0 3px}
.grid div{aspect-ratio:1;background:#222 center/cover;position:relative;cursor:pointer}
.grid span{position:absolute;right:4px;bottom:4px;font-size:10px;background:#0009;border-radius:4px;padding:1px 4px}
.empty{padding:60px 20px;text-align:center;color:var(--mu)}
/* STUDIO (Lightroom 25%) */
.st{display:grid;grid-template-columns:minmax(0,1fr) 300px;flex:1;min-height:0}
@media(max-width:780px){.st{grid-template-columns:1fr;grid-template-rows:minmax(240px,45%) 1fr}}
.cv{position:relative;background:#050506;display:grid;place-items:center;overflow:hidden;min-height:0}
.cv .stk{position:relative;max-width:100%;max-height:100%}
.cv canvas{display:block;max-width:100%;max-height:100%}
#cvO{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:8px;background:#000a;border-radius:4px;padding:2px 8px;font-size:11px}
.pnl{background:#121316;border-left:1px solid var(--ln);overflow:auto;padding:10px 12px}
.pnl h4{margin:12px 0 4px;font-size:11px;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.pnl .sl{display:grid;grid-template-columns:78px 1fr 34px;gap:6px;align-items:center;font-size:12px;color:#c5c7cf;margin:2px 0}
.pnl .sl output{text-align:right;color:var(--ac);font-size:11px}
.pnl input[type=range]{accent-color:#8ab4ff}
.btn{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:12px}.btn.p{background:var(--ac);color:#190a00;border-color:var(--ac);font-weight:700}
.rw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pnl input[type=text],.pnl input[type=password],.pnl textarea{width:100%;background:#0b0c0e;border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:7px;font:inherit;font-size:12px;margin:3px 0}
.note{font-size:11px;color:var(--mu)}
.vf video,.vf canvas.demo{transition:none;transform-origin:0 0;will-change:transform}
.pill.on{background:var(--ac);color:#190a00;font-weight:700}
#bAI{padding:8px 14px}
@media(orientation:landscape) and (max-height:620px){
#t-cam.on{flex-direction:row}.vf{max-width:none;margin:0}
.top{flex-direction:column;align-items:flex-start;right:auto;gap:8px}.sug{top:8px}
.lens{left:auto;right:10px;top:0;bottom:0;flex-direction:column-reverse;justify-content:center}
.ctrl{max-width:none;width:150px;margin:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px}
.modes{flex-direction:column;align-items:center;gap:10px;margin:0}.shutrow{flex-direction:column;gap:14px}
.pro{max-width:230px;margin:0;border-top:0;border-left:1px solid var(--ln);order:2;overflow:auto}
}
</style></head><body>

<!-- ===== CAMERA ===== -->
<section class="tab on" id="t-cam">
<div class="vf" id="vf">
 <canvas class="demo" id="demo" width="480" height="640"></canvas>
 <video id="vid" playsinline muted style="display:none"></video>
 <canvas id="ov"></canvas>
 <div class="top"><button class="pill" id="bFlash">⚡ Tắt</button><button class="pill" id="bGrid">▦ Lưới</button><button class="pill on" id="bAI">✨ AI Auto: Bật</button></div>
 <div class="sug" id="sug">Đang tìm chủ thể…</div>
 <div class="lens" id="lens"></div>
</div>
<div class="pro" id="pro">
 <canvas id="hist" width="300" height="42"></canvas>
 <div class="sl"><span>EV</span><input type="range" id="pEV" min="-3" max="3" step=".1" value="0"><output id="oEV">0.0</output></div>
 <div class="sl"><span>ISO</span><input type="range" id="pISO" min="100" max="3200" step="100" value="100"><output id="oISO">100</output></div>
 <div class="sl"><span>WB (K)</span><input type="range" id="pWB" min="2500" max="8000" step="100" value="5500"><output id="oWB">5500</output></div>
 <div class="sl"><span>Tương phản</span><input type="range" id="pCT" min="-50" max="50" value="0"><output id="oCT">0</output></div>
</div>
<div class="ctrl">
 <div class="modes" id="modes"><b data-m="photo" class="on">Ảnh</b><b data-m="portrait">Chân dung</b><b data-m="night">Đêm</b><b data-m="pro">Pro</b></div>
 <div class="shutrow"><div class="thumb" id="thumb"></div><button class="shut" id="shut"><i></i></button><button class="flip" id="flip">🔄</button></div>
 <div class="note" id="camNote" style="text-align:center;margin-top:6px"></div>
</div>
</section>

<!-- ===== THƯ VIỆN ===== -->
<section class="tab" id="t-gal">
<div class="gh"><h2>Thư viện</h2><button class="gb" id="bImp">⬆ Nhập từ máy</button><button class="gb" id="bExp">⬇ Xuất tất cả</button><input type="file" id="fImp" accept="image/*" multiple hidden></div>
<div id="galBody"></div>
</section>

<!-- ===== STUDIO ===== -->
<section class="tab" id="t-stu">
<div class="st">
 <div class="cv" id="cvbox"><div class="empty" id="stEmpty">Chọn một ảnh trong Thư viện để chỉnh sửa.<br>Ảnh gốc luôn được giữ nguyên.</div>
 <div class="stk" id="stk" style="display:none"><canvas id="cvA"></canvas><canvas id="cvO" style="display:none"></canvas><span class="tag" id="tagA" style="right:8px">Sau</span><span class="tag" id="tagB" style="left:8px;display:none">Trước</span></div></div>
 <div class="pnl" id="pnl">
  <div class="rw"><button class="btn p" id="sAuto">✨ Tự chỉnh AI</button><button class="btn" id="sCmp">◐ So sánh</button><button class="btn" id="sRst">↺ Gốc</button></div>
  <input type="range" id="cmpR" min="0" max="100" value="50" style="display:none">
  <h4>Ánh sáng</h4><div id="slL"></div><h4>Màu sắc</h4><div id="slC"></div>
  <h4>Gemini</h4>
  <input type="password" id="gKey" placeholder="Gemini API key (lưu trên máy bạn)">
  <textarea id="gPr" rows="2" placeholder="VD: làm ấm ánh hoàng hôn, xoá người ở nền…"></textarea>
  <div class="rw"><button class="btn" id="gAdj">Gemini gợi ý thông số</button><button class="btn" id="gGen">Gemini tạo ảnh chỉnh sửa</button></div>
  <div class="note" id="gMsg">Cần mở file này trực tiếp trên máy hoặc tự host để gọi được API Google.</div>
  <div class="rw" style="margin-top:14px"><button class="btn p" id="sSave">💾 Lưu bản chỉnh</button><button class="btn" id="sDl">⬇ Tải JPG</button></div>
 </div>
</div></section>

<nav><button class="on" data-t="cam"><i>📷</i>Camera</button><button data-t="gal"><i>🖼</i>Thư viện</button><button data-t="stu"><i>🎛</i>Studio</button></nav>

<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ---------- Tab ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('t-'+b.dataset.t).classList.add('on');if(b.dataset.t==='gal')loadGal()});
const go=t=>document.querySelector(`nav [data-t=${t}]`).click();

/* ---------- IndexedDB (đồng bộ thư viện với máy, không Supabase) ---------- */
let db;const dbp=new Promise(r=>{const q=indexedDB.open('aps',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()}});
const tx=(m,f)=>dbp.then(()=>new Promise(r=>{const t=db.transaction('p',m),s=t.objectStore('p'),q=f(s);t.oncomplete=()=>r(q&&q.result)}));
const dbAll=()=>tx('readonly',s=>s.getAll()),dbPut=o=>tx('readwrite',s=>s.put(o)),dbGet=i=>tx('readonly',s=>s.get(i));
const thumbOf=async b=>{const im=await bmp(b),c=document.createElement('canvas'),k=300/Math.max(im.width,im.height);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)};
const bmp=b=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(b)});
const blobOf=(c,q=.93)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));

/* ---------- CAMERA ---------- */
const vid=$('vid'),demo=$('demo'),ov=$('ov');let stream,track,facing='environment',lenses=[],curLens=1,digital=1,mode='photo',aiOn=true,gridOn=true,P={ev:0,iso:100,wb:5500,ct:0};
let tt=0;setInterval(()=>{if(stream)return;const c=demo.getContext('2d'),w=480,h=640,g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#5b8def');g.addColorStop(.55,'#ffb27a');g.addColorStop(1,'#2d3b2a');c.fillStyle=g;c.fillRect(0,0,w,h);const x=170+Math.sin(tt)*50;c.fillStyle='#e8d7c3';c.beginPath();c.arc(x,260,38,0,7);c.fill();c.fillRect(x-30,300,60,150);c.fillStyle='#222';c.beginPath();c.arc(x-12,254,4,0,7);c.arc(x+12,254,4,0,7);c.fill();tt+=.04},60);
async function startCam(){try{stream&&stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1440}},audio:false});
 vid.srcObject=stream;await vid.play();vid.style.display='block';demo.style.display='none';track=stream.getVideoTracks()[0];await detectLenses();$('camNote').textContent=''}
 catch(e){$('camNote').textContent='Không mở được camera (quyền bị chặn?). Đang dùng cảnh mẫu – bạn vẫn có thể thử khung hình AI.'}}
/* Tele / không tele: dò thấu kính thật, thiếu thì dùng zoom phần cứng, rồi zoom số */
async function detectLenses(){const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),cap=track.getCapabilities?track.getCapabilities():{};
 const find=re=>devs.find(d=>re.test(d.label));const uw=find(/ultra|0\.5|0,5/i),tele=find(/tele|3x|5x|zoom/i);
 lenses=[];if(uw)lenses.push({z:.6,dev:uw.deviceId,t:'0.6'});lenses.push({z:1,t:'1×'});
 const hz=cap.zoom?cap.zoom.max:1;
 [2,3,5].forEach(z=>{if(z===3&&tele)lenses.push({z:3,dev:tele.deviceId,t:'3×',tele:1});else lenses.push({z,hw:hz>=z,t:z+'×'})});
 $('lens').innerHTML=lenses.map((l,i)=>`<button data-i="${i}" class="${l.z===1?'on':''}">${l.t}</button>`).join('')}
$('lens').onclick=async e=>{const i=e.target.dataset.i;if(i==null)return;const l=lenses[i];document.querySelectorAll('#lens button').forEach(b=>b.classList.toggle('on',b===e.target));curLens=l.z;digital=1;
 if(stream&&l.dev){try{stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:l.dev}}});vid.srcObject=stream;track=stream.getVideoTracks()[0];$('camNote').textContent='Dùng ống kính '+l.t+' (phần cứng)';return}catch(_){}}
 if(l.z<1){digital=1;$('camNote').textContent='Máy không có góc siêu rộng – dùng 1×';return}
 if(l.z>1){if(l.hw&&track){try{await track.applyConstraints({advanced:[{zoom:l.z}]});$('camNote').textContent='Zoom quang/phần cứng '+l.t;return}catch(_){}}
  digital=l.z;$('camNote').textContent=l.tele?'':'Máy không có tele → zoom số '+l.t+' (cắt khung, chất lượng giảm)'}else $('camNote').textContent='';
 applyView()};
function applyView(){const f=`brightness(${Math.pow(2,P.ev*.7)*Math.pow(P.iso/100,.25)}) contrast(${1+P.ct/100}) sepia(${clamp((5500-P.wb)/6000,0,.5)}) hue-rotate(${clamp((P.wb-5500)/60,-40,0)}deg)`;
 [vid,demo].forEach(e=>{e.style.filter=f})}
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCam()};
$('bFlash').onclick=async e=>{const on=e.target.dataset.on!=='1';try{await track.applyConstraints({advanced:[{torch:on}]});e.target.dataset.on=on?1:0;e.target.textContent=on?'⚡ Bật':'⚡ Tắt'}catch(_){e.target.textContent='⚡ N/A'}};
$('bGrid').onclick=()=>{gridOn=!gridOn};$('bAI').onclick=e=>{aiOn=!aiOn;e.target.classList.toggle('on',aiOn);e.target.textContent='✨ AI Auto: '+(aiOn?'Bật':'Tắt')};
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#modes b').forEach(b=>b.classList.toggle('on',b===e.target));$('pro').classList.toggle('on',m==='pro');
 const pre={photo:[0,100,5500,0],portrait:[.2,100,5800,8],night:[.8,1600,5200,12],pro:[P.ev,P.iso,P.wb,P.ct]}[m];[P.ev,P.iso,P.wb,P.ct]=pre;syncPro();applyView()};
const prs=[['pEV','ev','oEV',v=>(+v).toFixed(1)],['pISO','iso','oISO',v=>v],['pWB','wb','oWB',v=>v],['pCT','ct','oCT',v=>v]];
function syncPro(){prs.forEach(([i,k,o,f])=>{$(i).value=P[k];$(o).textContent=f(P[k])})}
prs.forEach(([i,k,o,f])=>$(i).oninput=()=>{P[k]=+$(i).value;$(o).textContent=f(P[k]);applyView();if(k==='ev'&&track)track.applyConstraints({advanced:[{exposureCompensation:P.ev}]}).catch(()=>{})});
const src=()=>stream?vid:demo;

/* ---------- Khung hình AI (nhận diện mặt/mắt/chủ thể) ---------- */
const FD='FaceDetector' in window?new FaceDetector({fastMode:true,maxDetectedFaces:4}):null;
const sm=document.createElement('canvas');sm.width=96;sm.height=128;const sx=sm.getContext('2d',{willReadFrequently:true});
let subj=null,hy=[],level=0;
async function smart(){if(!aiOn){subj=null;$('sug').style.display='none';return}$('sug').style.display='block';
 const s=src();let box=null,eyes=null,kind='chủ thể';
 try{if(FD&&stream){const f=await FD.detect(vid);if(f.length){const b=f.sort((a,b)=>b.boundingBox.width-a.boundingBox.width)[0];const W=vid.videoWidth,H=vid.videoHeight,r=Math.max(ov.width/W,ov.height/H),ox=(W*r-ov.width)/2,oy=(H*r-ov.height)/2;
  const m=p=>({x:p.x*r-ox,y:p.y*r-oy}),bb=b.boundingBox;box={x:bb.x*r-ox,y:bb.y*r-oy,w:bb.width*r,h:bb.height*r};kind='khuôn mặt';
  eyes=(b.landmarks||[]).filter(l=>l.type==='eye').map(l=>m(l.locations[0]))}}}catch(_){}
 if(!box){sx.drawImage(s,0,0,96,128);const d=sx.getImageData(0,0,96,128).data;let sw=0,cx=0,cy=0,ex=0,ey=0;const lum=[];for(let i=0;i<d.length;i+=4)lum.push(.3*d[i]+.59*d[i+1]+.11*d[i+2]);
  const mean=lum.reduce((a,b)=>a+b)/lum.length;for(let y=1;y<127;y++)for(let x=1;x<95;x++){const i=y*96+x,e=Math.abs(lum[i]-lum[i+1])+Math.abs(lum[i]-lum[i+96]),w=e*e+Math.abs(lum[i]-mean);sw+=w;cx+=x*w;cy+=y*w}
  if(sw>0){cx=cx/sw/96*ov.width;cy=cy/sw/128*ov.height;const sz=ov.width*.3;box={x:cx-sz/2,y:cy-sz/2,w:sz,h:sz}}}
 subj=box?{box,eyes,kind}:null;
 if(!box){$('sug').textContent='Hướng máy vào chủ thể';return}
 const w=ov.width,h=ov.height,cx=box.x+box.w/2,cy=box.y+(eyes&&eyes.length?(eyes[0].y-box.y):box.h*.35),tx=cx<w/2?w/3:2*w/3,ty=h/3,dx=(cx-tx)/w,dy=(cy-ty)/h;let msg,ok=false;
 const area=box.w*box.h/(w*h);
 if(Math.abs(dx)<.06&&Math.abs(dy)<.08)msg=`✅ ${kind[0].toUpperCase()+kind.slice(1)} đã vào điểm 1/3 – chụp đi!`,ok=true;
 else if(Math.abs(dx)>=Math.abs(dy))msg=`${dx>0?'⬅ Xoay máy sang trái':'➡ Xoay máy sang phải'} để ${kind} vào điểm 1/3`;
 else msg=dy>0?'⬆ Nâng máy lên (chừa ít đầu hơn)':'⬇ Hạ máy xuống (chừa thêm đầu)';
 if(!ok&&kind==='khuôn mặt'){if(area<.03)msg='🔍 Lại gần hơn hoặc zoom 2× – mặt còn nhỏ';else if(area>.35)msg='↔ Lùi ra một chút để không cắt đầu'}
 $('sug').textContent=msg;$('sug').classList.toggle('ok',ok);subj.tgt={x:tx,y:ty}}
/* ===== AI Auto: tự zoom + căn khung + cân sáng (nhẹ, mượt) ===== */
const V={z:1,tx:0,ty:0},T={z:1,tx:0,ty:0};let miss=0,last=null;
const aeC=document.createElement('canvas');aeC.width=48;aeC.height=64;const aeX=aeC.getContext('2d',{willReadFrequently:true});
function ae(){aeX.drawImage(src(),0,0,48,64);const d=aeX.getImageData(0,0,48,64).data,n=d.length/4,L=[];let m=0;for(let i=0;i<d.length;i+=4){const y=.3*d[i]+.59*d[i+1]+.11*d[i+2];L.push(y);m+=y}m/=n;let v=0;L.forEach(y=>v+=(y-m)**2);v=Math.sqrt(v/n);
 const te=clamp(Math.log2(118/Math.max(m,8))*.9+(mode==='night'?.4:0),-1.5,1.5),tc=clamp((55-v)*.5,-10,20);
 if(Math.abs(te-P.ev)>.05||Math.abs(tc-P.ct)>1){P.ev+=(te-P.ev)*.3;P.ct+=(tc-P.ct)*.3;applyView()}}
function autoFrame(){const w=ov.width,h=ov.height;T.z=digital;T.tx=w*(1-digital)/2;T.ty=h*(1-digital)/2;if(!aiOn)return;
 if(subj)miss=0,last=subj;else miss++;const sj=subj||(miss<6?last:null);
 if(sj&&sj.kind==='khuôn mặt'){const b=sj.box,cx=b.x+b.w/2,cy=b.y+(sj.eyes&&sj.eyes.length?sj.eyes[0].y-b.y:b.h*.4),z=Math.max(digital,clamp(.36*w/b.w,1,3));
  T.z=z;T.tx=clamp(w/2-z*cx,w-z*w,0);T.ty=clamp(h*.4-z*cy,h-z*h,0);$('sug').textContent=`✨ AI tự căn khung · ${z.toFixed(1)}×`;$('sug').classList.add('ok')}
 else{$('sug').textContent=sj?'✨ AI Auto: tối ưu ánh sáng':'✨ AI Auto: đang tìm chủ thể…';$('sug').classList.toggle('ok',!!sj)}
 if(mode!=='pro')ae()}
function step(){let c=0;for(const p of['z','tx','ty']){const d=T[p]-V[p];if(Math.abs(d)>(p==='z'?.002:.3)){V[p]+=d*.12;c=1}}
 if(c||!V.init){V.init=1;vid.style.transform=demo.style.transform=`translate(${V.tx}px,${V.ty}px) scale(${V.z})`}}
function crop(s){const W=s.videoWidth||480,H=s.videoHeight||640,r=Math.max(ov.width/W,ov.height/H),ox=(W*r-ov.width)/2,oy=(H*r-ov.height)/2,z=V.z;return[(-V.tx/z+ox)/r,(-V.ty/z+oy)/r,ov.width/z/r,ov.height/z/r]}
/* bộ điều tốc: phân tích tối đa ~25% thời gian CPU, tạm dừng khi ẩn tab */
(async function loop(){const t0=performance.now();if(!document.hidden&&$('t-cam').classList.contains('on')){try{await smart();autoFrame()}catch(_){}}setTimeout(loop,Math.max(220,(performance.now()-t0)*3))})();
function drawOv(){const c=ov.getContext('2d'),r=ov.getBoundingClientRect();if(ov.width!==r.width)ov.width=r.width,ov.height=r.height;const w=ov.width,h=ov.height;c.clearRect(0,0,w,h);
 if(gridOn){c.strokeStyle='#fff5';c.lineWidth=1;c.beginPath();[1,2].forEach(i=>{c.moveTo(w*i/3,0);c.lineTo(w*i/3,h);c.moveTo(0,h*i/3);c.lineTo(w,h*i/3)});c.stroke()}
 if(subj){const b=subj.box;c.strokeStyle=subj.kind==='khuôn mặt'?'#34d399':'#ff7a1a';c.lineWidth=2;c.strokeRect(b.x,b.y,b.w,b.h);
  if(subj.eyes)subj.eyes.forEach(p=>{c.beginPath();c.arc(p.x,p.y,4,0,7);c.fillStyle='#34d399';c.fill()});
  if(subj.tgt){c.strokeStyle='#ff7a1a';c.beginPath();c.arc(subj.tgt.x,subj.tgt.y,12,0,7);c.stroke()}}
 // histogram (Pro)
 if($('pro').classList.contains('on')){sx.filter='none';sx.drawImage(src(),0,0,96,128);const d=sx.getImageData(0,0,96,128).data,H=new Array(48).fill(0);for(let i=0;i<d.length;i+=4)H[(.3*d[i]+.59*d[i+1]+.11*d[i+2])*47/255|0]++;const hc=$('hist').getContext('2d'),m=Math.max(...H);hc.clearRect(0,0,300,42);hc.fillStyle='#ddd';H.forEach((v,i)=>hc.fillRect(i*6.25,42-v/m*40,5,v/m*40))}
 step();requestAnimationFrame(drawOv)}drawOv();

/* ---------- Chụp ---------- */
$('shut').onclick=async()=>{const s=src(),cr=crop(s),k=Math.min(1,2400/Math.max(cr[2],cr[3])),w=Math.round(cr[2]*k),h=Math.round(cr[3]*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 x.filter=`brightness(${Math.pow(2,P.ev*.7)*Math.pow(P.iso/100,.25)}) contrast(${1+P.ct/100})`;x.drawImage(s,...cr,0,0,w,h);
 const b=await blobOf(c),id=Date.now();await dbPut({id,t:id,orig:b,cur:b,thumb:await thumbOf(b),p:null,src:'camera',mode});$('thumb').style.backgroundImage=`url(${URL.createObjectURL(b)})`;
 $('vf').style.opacity=.4;setTimeout(()=>$('vf').style.opacity=1,100);if(navigator.vibrate)navigator.vibrate(20)};
$('thumb').onclick=()=>go('gal');

/* ---------- THƯ VIỆN ---------- */
async function loadGal(){const a=(await dbAll()).sort((x,y)=>y.t-x.t),g=$('galBody');if(!a.length){g.innerHTML='<div class="empty">Chưa có ảnh. Chụp hoặc nhập ảnh từ máy.</div>';return}
 const days={};a.forEach(p=>{(days[new Date(p.t).toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric'})]??=[]).push(p)});
 g.innerHTML=Object.entries(days).map(([d,l])=>`<div class="day">${d}</div><div class="grid">${l.map(p=>`<div data-id="${p.id}" style="background-image:url(${p.thumb})">${p.p?'<span>✎</span>':''}</div>`).join('')}</div>`).join('')}
$('galBody').onclick=e=>{const id=e.target.dataset.id;if(id)openStudio(+id)};
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=async e=>{for(const f of e.target.files){const id=Date.now()+Math.random()*1000|0;await dbPut({id,t:f.lastModified||id,orig:f,cur:f,thumb:await thumbOf(f),p:null,src:'import'})}loadGal()};
$('bExp').onclick=async()=>{for(const p of await dbAll()){const a=document.createElement('a');a.href=URL.createObjectURL(p.cur);a.download='aps-'+p.id+'.jpg';a.click();await new Promise(r=>setTimeout(r,250))}};

/* ---------- STUDIO: chỉnh sửa không phá huỷ ---------- */
const SL=[['ex','Phơi sáng',-3,3,.05,0,'L'],['ct','Tương phản',-100,100,1,0,'L'],['hl','Vùng sáng',-100,100,1,0,'L'],['sh','Vùng tối',-100,100,1,0,'L'],['tp','Nhiệt độ',-100,100,1,0,'C'],['sa','Bão hoà',-100,100,1,0,'C'],['vg','Viền tối',0,100,1,0,'C']];
let cur=null,E={},base=null,orig2=null;
SL.forEach(s=>$('sl'+s[6]).insertAdjacentHTML('beforeend',`<div class="sl"><span>${s[1]}</span><input type="range" id="e_${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${s[5]}"><output id="o_${s[0]}">0</output></div>`));
SL.forEach(s=>$('e_'+s[0]).oninput=()=>{E[s[0]]=+$('e_'+s[0]).value;$('o_'+s[0]).textContent=E[s[0]];queue()});
const zero=()=>Object.fromEntries(SL.map(s=>[s[0],0]));
function setE(o){E={...zero(),...o};SL.forEach(s=>{$('e_'+s[0]).value=E[s[0]];$('o_'+s[0]).textContent=E[s[0]]})}
async function openStudio(id){cur=await dbGet(id);const im=await bmp(cur.orig),k=Math.min(1,1400/Math.max(im.width,im.height)),w=im.width*k|0,h=im.height*k|0;
 for(const c of [$('cvA'),$('cvO')]){c.width=w;c.height=h}$('cvO').getContext('2d').drawImage(im,0,0,w,h);const a=$('cvA').getContext('2d');a.drawImage(im,0,0,w,h);base=a.getImageData(0,0,w,h);
 $('stEmpty').style.display='none';$('stk').style.display='block';setE(cur.p||{});go('stu');render()}
function proc(src,dst,e,vgOn=true){const s=src.data,d=dst.data,w=src.width,h=src.height,ex=Math.pow(2,e.ex),c=1+e.ct/100,sa=1+e.sa/100,t=e.tp/100*30,hl=e.hl/100*.6,sh=e.sh/100*.6,vg=e.vg/100;
 for(let i=0,p=0;i<s.length;i+=4,p++){let r=s[i]*ex+t,g=s[i+1]*ex,b=s[i+2]*ex-t;const y=.3*r+.59*g+.11*b,n=y/255;
  const dl=n>.5?-hl*(n-.5)*2*255*.5:sh*(.5-n)*2*255*.5;r+=dl;g+=dl;b+=dl;
  r=(r-128)*c+128;g=(g-128)*c+128;b=(b-128)*c+128;const l=.3*r+.59*g+.11*b;r=l+(r-l)*sa;g=l+(g-l)*sa;b=l+(b-l)*sa;
  if(vg&&vgOn){const x=(p%w)/w-.5,yy=((p/w)|0)/h-.5,f=1-vg*Math.min(1,(x*x+yy*yy)*2.2);r*=f;g*=f;b*=f}
  d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255}}
let q=0;const queue=()=>{if(!q)q=requestAnimationFrame(()=>{q=0;render()})};
function render(){if(!base)return;const c=$('cvA'),x=c.getContext('2d'),o=x.createImageData(base.width,base.height);proc(base,o,E);x.putImageData(o,0,0)}
let cmp=false;$('sCmp').onclick=()=>{cmp=!cmp;$('cvO').style.display=cmp?'block':'none';$('tagB').style.display=cmp?'block':'none';$('cmpR').style.display=cmp?'block':'none';$('cvO').style.clipPath=`inset(0 ${100-$('cmpR').value}% 0 0)`};
$('cmpR').oninput=e=>{$('cvO').style.clipPath=`inset(0 ${100-e.target.value}% 0 0)`;$('tagB').style.left='8px'};
$('sRst').onclick=()=>{setE({});render()};
/* Tự chỉnh AI (cục bộ: phân tích histogram → thông số kiểu Lightroom Auto) */
$('sAuto').onclick=()=>{if(!base)return;const d=base.data,n=d.length/4;let m=0,v=0,hi=0,lo=0,R=0,B=0;for(let i=0;i<d.length;i+=4){const y=.3*d[i]+.59*d[i+1]+.11*d[i+2];m+=y;R+=d[i];B+=d[i+2];if(y>245)hi++;if(y<10)lo++}m/=n;for(let i=0;i<d.length;i+=4){const y=.3*d[i]+.59*d[i+1]+.11*d[i+2];v+=(y-m)**2}v=Math.sqrt(v/n);
 setE({ex:+clamp(Math.log2(118/m)*.8,-1.5,1.5).toFixed(2),ct:clamp(Math.round((58-v)*1.2),-30,40),hl:hi/n>.03?-50:-15,sh:lo/n>.05||m<100?45:20,tp:clamp(Math.round((B/R-1)*60),-25,25),sa:18,vg:12});render()};
/* Lưu / tải */
async function fullRender(){const im=await bmp(cur.orig),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);const s=x.getImageData(0,0,c.width,c.height),o=x.createImageData(c.width,c.height);proc(s,o,E);x.putImageData(o,0,0);return blobOf(c)}
$('sSave').onclick=async()=>{if(!cur)return;const b=await fullRender();cur.cur=b;cur.p={...E};cur.thumb=await thumbOf(b);await dbPut(cur);$('gMsg').textContent='Đã lưu – ảnh gốc vẫn được giữ nguyên, bấm ↺ Gốc để quay lại.'};
$('sDl').onclick=async()=>{if(!cur)return;const a=document.createElement('a');a.href=URL.createObjectURL(await fullRender());a.download='aps-edit-'+cur.id+'.jpg';a.click()};
/* Gemini: gợi ý thông số & tạo ảnh (cần chạy ngoài môi trường trang đã publish) */
$('gKey').value=localStorage.getItem('gk')||'AQ.Ab8RN6Lu0DB9wMmJ3WYIgZYNiTK_Aae8l0RYLdTvSH-cZ_Jbpw';$('gKey').onchange=e=>localStorage.setItem('gk',e.target.value);
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
async function gem(model,parts,cfg){const k=$('gKey').value;if(!k)throw Error('Hãy nhập Gemini API key');const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:cfg})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return j}
$('gAdj').onclick=async()=>{if(!cur)return;$('gMsg').textContent='Gemini đang phân tích…';try{const j=await gem('gemini-2.5-flash',[{inline_data:{mime_type:'image/jpeg',data:await b64(cur.orig)}},{text:`Bạn là nhiếp ảnh gia chuyên nghiệp. ${$('gPr').value||'Chỉnh ảnh đẹp tự nhiên.'} Trả về JSON với các khoá ex(-3..3),ct,hl,sh,tp,sa(-100..100),vg(0..100).`}],{responseMimeType:'application/json'});
 setE(JSON.parse(j.candidates[0].content.parts[0].text));render();$('gMsg').textContent='Đã áp dụng thông số từ Gemini.'}catch(e){$('gMsg').textContent='Lỗi: '+e.message}};
$('gGen').onclick=async()=>{if(!cur)return;$('gMsg').textContent='Gemini đang tạo ảnh…';try{const j=await gem('gemini-2.5-flash-image',[{text:$('gPr').value||'Cải thiện ảnh chuyên nghiệp'},{inline_data:{mime_type:'image/jpeg',data:await b64(cur.orig)}}]);
 const p=j.candidates[0].content.parts.find(p=>p.inlineData||p.inline_data),d=(p.inlineData||p.inline_data).data,bin=atob(d),u=new Uint8Array(bin.length).map((_,i)=>bin.charCodeAt(i));
 const b=new Blob([u],{type:'image/png'}),id=Date.now();await dbPut({id,t:id,orig:b,cur:b,thumb:await thumbOf(b),p:null,src:'gemini'});$('gMsg').textContent='Ảnh AI đã được lưu thành bản mới trong Thư viện (ảnh gốc không đổi).'}catch(e){$('gMsg').textContent='Lỗi: '+e.message}};

startCam();
