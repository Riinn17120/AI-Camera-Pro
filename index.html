<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Photo Studio</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--cd:#151923;--ln:#29303d;--tx:#f4f2ed;--mu:#9ba3b2;--ac:#d8b77a;--gn:#8fc9aa;--glass:#111722;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -20%,#202a3b 0%,var(--bg) 55%);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;letter-spacing:.01em}
.tab{display:none;flex:1;min-height:0;overflow:auto}.tab.on{display:flex;flex-direction:column}
nav{display:flex;border-top:1px solid #ffffff12;background:#0d1119ed;backdrop-filter:blur(18px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px #0003}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 0;font:inherit;font-size:12px}
nav button.on{color:var(--ac)}nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}nav button{padding:11px 0 9px}
button,select{font:inherit;color:var(--tx);cursor:pointer}
/* CAMERA (Oppo 60%) */
.vf{position:relative;flex:1;min-height:300px;background:#05070b;overflow:hidden;max-width:620px;width:100%;margin:10px auto 0;border:1px solid #ffffff12;border-radius:22px;box-shadow:0 18px 55px #0008;touch-action:pan-y}
.vf video,.vf canvas.fx,.vf canvas.demo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.focus-ring{position:absolute;width:54px;height:54px;border:1.5px solid #f2d69b;border-radius:50%;z-index:4;pointer-events:none;display:none;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 5px #000);animation:focusPulse .75s ease-out}
.focus-ring:before,.focus-ring:after{content:"";position:absolute;background:#f2d69b}\n.focus-ring:before{width:1px;height:12px;left:50%;top:-7px}.focus-ring:after{height:1px;width:12px;top:50%;left:-7px}
@keyframes focusPulse{0%{opacity:.4;scale:.78}35%{opacity:1;scale:1.08}100%{opacity:.9;scale:1}}
@media (pointer:fine){.focus-ring{border-radius:10px}}
.top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pill{background:#111722bd;border:1px solid #ffffff1b;border-radius:20px;padding:7px 12px;font-size:12px;backdrop-filter:blur(14px);box-shadow:0 4px 16px #0004}
.sug{position:absolute;left:50%;top:52px;transform:translateX(-50%);background:#d8b77ae8;color:#17130b;font-weight:700;border-radius:20px;padding:7px 15px;font-size:12px;z-index:3;white-space:nowrap;transition:.2s;box-shadow:0 5px 20px #0005}
.sug.ok{background:#34d399cc}
.sugbtn{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.sugbtn button{border:0;border-radius:18px;padding:8px 18px;font-weight:700;font-size:13px;background:#34d399;color:#04210f}
.sugbtn button.no{background:#000a;color:#fff;font-weight:500;backdrop-filter:blur(8px)}
.lens{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:8px;z-index:3}
.lens button{width:38px;height:38px;border-radius:50%;background:#0009;border:1px solid #fff3;font-size:12px}
.lens button.on{color:var(--ac);border-color:var(--ac);transform:scale(1.12)}
.ctrl{max-width:620px;width:100%;margin:0 auto;background:linear-gradient(180deg,#090b10,#111722);padding:12px 18px 16px;border-radius:0 0 22px 22px}
.modes{display:flex;justify-content:center;gap:20px;color:var(--mu);margin-bottom:8px}
.modes b{font-weight:500;cursor:pointer;padding:2px 0}.modes b.on{color:var(--ac);border-bottom:2px solid var(--ac)}
.shutrow{display:flex;align-items:center;justify-content:space-between}
.thumb{width:50px;height:50px;border-radius:14px;background:#222 center/cover;border:1px solid #ffffff30;box-shadow:0 5px 18px #0005}
.shut{width:72px;height:72px;border-radius:50%;border:2px solid #f4e6c8;background:linear-gradient(145deg,#d8b77a,#f3e1b8);padding:5px;box-shadow:0 0 0 5px #d8b77a22,0 8px 25px #0007}.shut i{display:block;width:100%;height:100%;border-radius:50%;background:#fffaf0}.shut:active i{transform:scale(.88)}
.flip{width:48px;height:48px;border-radius:50%;background:#202735;border:1px solid #ffffff18;font-size:20px}
.pro{display:none;background:#000;border-top:1px solid var(--ln);padding:8px 14px;max-width:560px;margin:0 auto;width:100%}.pro.on{display:block}
.pro .sl{display:grid;grid-template-columns:62px 1fr 56px;gap:8px;align-items:center;font:11px ui-monospace,monospace;color:var(--mu);margin:3px 0}
.pro .sl output{color:var(--gn);text-align:right}
#hist{width:100%;height:42px;background:#0a0a0c;border:1px solid var(--ln);border-radius:6px;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--ac)}
/* GALLERY (Google Photos 5%) */
.gh{padding:16px 16px;display:flex;gap:8px;align-items:center;position:sticky;top:0;background:#0b0f17ed;backdrop-filter:blur(16px);z-index:2;border-bottom:1px solid #ffffff10}
.gh h2{margin:0;font-size:21px;flex:1;font-weight:650;letter-spacing:-.03em}
.gb{background:#1a2230;border:1px solid #ffffff16;border-radius:20px;padding:7px 12px;font-size:12px;color:#e9e3d7}
.day{padding:14px 16px 7px;color:var(--ac);font-size:12px;font-weight:650;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px;padding:0 8px 10px}
.grid div{aspect-ratio:1;background:#222 center/cover;position:relative;cursor:pointer;border-radius:9px;overflow:hidden;box-shadow:0 4px 14px #0004}
.grid span{position:absolute;right:4px;bottom:4px;font-size:10px;background:#0009;border-radius:4px;padding:1px 4px}
.empty{padding:60px 20px;text-align:center;color:var(--mu)}
/* Gallery preview: xem ảnh trước, chỉ mở Studio khi người dùng chủ động chọn */
.viewer{position:fixed;inset:0;background:#050506f5;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:calc(100% - 110px);object-fit:contain}
.viewer .vbar{width:min(100%,560px);display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.viewer .vbar .btn{padding:10px 16px}
.viewer .vclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;border:0;border-radius:50%;width:40px;height:40px;background:#25262b;color:white;font-size:22px}
/* STUDIO (Lightroom 25%) */
.st{display:grid;grid-template-columns:minmax(0,1fr) 300px;flex:1;min-height:0}
@media(max-width:780px){.st{grid-template-columns:1fr;grid-template-rows:minmax(220px,40%) minmax(0,1fr)}.pnl{border-left:0;border-top:1px solid #ffffff14;padding:13px 14px 24px}.cv{min-height:220px}.pnl .rw:first-child{position:sticky;top:-13px;z-index:4;background:#151b27ed;padding:7px 0 10px;margin-top:-7px;backdrop-filter:blur(12px)}.pnl .sl{grid-template-columns:76px 1fr 36px;margin:7px 0}.pnl input[type=range]{min-height:26px}.tag{top:10px}}
.cv{position:relative;background:#050506;display:grid;place-items:center;overflow:hidden;min-height:0}
.cv .stk{position:relative;max-width:100%;max-height:100%}
.cv canvas{display:block;max-width:100%;max-height:100%}
#cvO{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;top:8px;background:#000a;border-radius:4px;padding:2px 8px;font-size:11px}
.pnl{background:linear-gradient(180deg,#151b27,#10151e);border-left:1px solid #ffffff12;overflow:auto;padding:16px 15px}
.pnl h4{margin:17px 0 7px;font-size:10px;letter-spacing:.15em;color:var(--ac);text-transform:uppercase}
.pnl .sl{display:grid;grid-template-columns:78px 1fr 34px;gap:6px;align-items:center;font-size:12px;color:#c5c7cf;margin:2px 0}
.pnl .sl output{text-align:right;color:var(--ac);font-size:11px}
.pnl input[type=range]{accent-color:#8ab4ff}
.btn{background:#202838;border:1px solid #ffffff18;border-radius:11px;padding:9px 12px;font-size:12px;color:#eee9df;transition:.18s}.btn.p{background:linear-gradient(135deg,#d8b77a,#f0d8a8);color:#1c170d;border-color:#e6c98f;font-weight:750;box-shadow:0 5px 16px #d8b77a22}
.rw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.pnl input[type=text],.pnl input[type=password],.pnl textarea{width:100%;background:#0b1019;border:1px solid #ffffff1c;border-radius:11px;color:var(--tx);padding:10px;font:inherit;font-size:12px;margin:4px 0}
.note{font-size:11px;color:var(--mu)}
.vf video,.vf canvas.demo{transition:none;transform-origin:0 0;will-change:transform}
.pill.on{background:var(--ac);color:#190a00;font-weight:700}
#bAI{padding:8px 14px}
@media(orientation:landscape) and (max-height:620px){
#t-cam.on{flex-direction:row}.vf{max-width:none;margin:0}
.top{flex-direction:column;align-items:flex-start;right:auto;gap:8px}.sug{top:8px}.sugbtn{top:44px}
.lens{left:auto;right:10px;top:0;bottom:0;flex-direction:column-reverse;justify-content:center}
.ctrl{max-width:none;width:150px;margin:0;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px}
.modes{flex-direction:column;align-items:center;gap:10px;margin:0}.shutrow{flex-direction:column;gap:14px}
.pro{max-width:230px;margin:0;border-top:0;border-left:1px solid var(--ln);order:2;overflow:auto}
}
</style></head><body>

<!-- ===== CAMERA ===== -->
<section class="tab on" id="t-cam">
<div class="vf" id="vf">
 <canvas class="demo" id="demo" width="480" height="640"></canvas>
 <video id="vid" playsinline muted style="display:none"></video>
 <canvas id="ov"></canvas><div class="focus-ring" id="focusRing" aria-hidden="true"></div>
 <div class="top"><button class="pill" id="bFlash">⚡ Tắt</button><button class="pill" id="bGrid">▦ Lưới</button><button class="pill" id="bRes">📐 4K</button><button class="pill" id="bAI">✨ AI: Tắt</button></div>
 <div class="sug" id="sug" style="display:none"></div><div class="sugbtn" id="sugBtn" style="display:none"></div>
 <div class="lens" id="lens"></div>
</div>
<div class="pro" id="pro">
 <canvas id="hist" width="300" height="42"></canvas>
 <div class="sl"><span>EV</span><input type="range" id="pEV" min="-3" max="3" step=".1" value="0"><output id="oEV">0.0</output></div>
 <div class="sl"><span>ISO</span><input type="range" id="pISO" min="100" max="3200" step="100" value="100"><output id="oISO">100</output></div>
 <div class="sl"><span>WB (K)</span><input type="range" id="pWB" min="2500" max="8000" step="100" value="5500"><output id="oWB">5500</output></div>
 <div class="sl"><span>Tương phản</span><input type="range" id="pCT" min="-50" max="50" value="0"><output id="oCT">0</output></div>
</div>
<div class="ctrl">
 <div class="modes" id="modes"><b data-m="photo" class="on">Ảnh</b><b data-m="portrait">Chân dung</b><b data-m="night">Đêm</b><b data-m="pro">Pro</b></div>
 <div class="shutrow"><div class="thumb" id="thumb"></div><button class="shut" id="shut"><i></i></button><button class="flip" id="flip">🔄</button></div>
 <div class="note" id="camNote" style="text-align:center;margin-top:6px"></div>
</div>
</section>

<!-- ===== THƯ VIỆN ===== -->
<section class="tab" id="t-gal">
<div class="gh"><h2>Thư viện</h2><button class="gb" id="bImp">⬆ Nhập từ máy</button><button class="gb" id="bExp">⬇ Xuất tất cả</button><input type="file" id="fImp" accept="image/*" multiple hidden></div>
<div id="galBody"></div>
</section>
<div class="viewer" id="imgViewer" aria-hidden="true">
 <button class="vclose" id="vClose" aria-label="Đóng">×</button>
 <img id="vImg" alt="Ảnh xem trước">
 <div class="vbar"><span class="note" id="vInfo">Xem ảnh</span><button class="btn p" id="vEdit">✎ Chỉnh sửa ảnh</button></div>
</div>

<!-- ===== STUDIO ===== -->
<section class="tab" id="t-stu">
<div class="st">
 <div class="cv" id="cvbox"><div class="empty" id="stEmpty">Chọn ảnh từ Thư viện để bắt đầu hậu kỳ.<br>Ảnh gốc luôn được bảo toàn.</div>
 <div class="stk" id="stk" style="display:none"><canvas id="cvA"></canvas><canvas id="cvO" style="display:none"></canvas><span class="tag" id="tagA" style="right:8px">Sau</span><span class="tag" id="tagB" style="left:8px;display:none">Trước</span></div></div>
 <div class="pnl" id="pnl">
  <div class="rw"><button class="btn p" id="sAuto">✨ Tự chỉnh AI</button><button class="btn" id="sCmp">◐ So sánh</button><button class="btn" id="sRst">↺ Gốc</button></div>
  <input type="range" id="cmpR" min="0" max="100" value="50" style="display:none">
  <h4>Ánh sáng</h4><div id="slL"></div><h4>Màu sắc</h4><div id="slC"></div>
  <h4>Trợ lý AI</h4>
  <input type="password" id="gKey" placeholder="Gemini API key (lưu trên máy bạn)">
  <textarea id="gPr" rows="2" placeholder="VD: làm ấm ánh hoàng hôn, xoá người ở nền…"></textarea>
  <div class="rw"><button class="btn" id="gAdj">AI gợi ý thông số</button><button class="btn" id="gGen">AI tạo ảnh chỉnh sửa</button></div>
  <div class="note" id="gMsg">Cần mở file này trực tiếp trên máy hoặc tự host để gọi được API Google.</div>
  <div class="rw" style="margin-top:14px"><button class="btn p" id="sSave">💾 Lưu bản chỉnh</button><button class="btn" id="sDl">⬇ Tải JPG</button></div>
 </div>
</div></section>

<nav><button class="on" data-t="cam"><i>📷</i>Camera</button><button data-t="gal"><i>🖼</i>Thư viện</button><button data-t="stu"><i>🎛</i>Studio</button></nav>

<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* ---------- Tab ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('t-'+b.dataset.t).classList.add('on');if(b.dataset.t==='gal')loadGal()});
const go=t=>document.querySelector(`nav [data-t=${t}]`).click();

/* ---------- IndexedDB (đồng bộ thư viện với máy, không Supabase) ---------- */
let db;const dbp=new Promise(r=>{const q=indexedDB.open('aps',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()}});
const tx=(m,f)=>dbp.then(()=>new Promise(r=>{const t=db.transaction('p',m),s=t.objectStore('p'),q=f(s);t.oncomplete=()=>r(q&&q.result)}));
const dbAll=()=>tx('readonly',s=>s.getAll()),dbPut=o=>tx('readwrite',s=>s.put(o)),dbGet=i=>tx('readonly',s=>s.get(i));
const thumbOf=async b=>{const im=await bmp(b),c=document.createElement('canvas'),k=300/Math.max(im.width,im.height);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)};
const bmp=b=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(b)});
const blobOf=(c,q=.93)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));

/* ---------- CAMERA ---------- */
const vid=$('vid'),demo=$('demo'),ov=$('ov');
// Kích thước yêu cầu theo chuẩn phổ biến 16:9; camera có thể trả về kích thước khác.
const RES={FHD:{w:1920,h:1080,cap:1920},'4K':{w:3840,h:2160,cap:3840},'8K':{w:7680,h:4320,cap:7680}};
let stream,track,ic,photoCaps,camCaps={},hardwareEV=false,facing='environment',lenses=[],curLens=1,digital=1,mode='photo',aiOn=false,gridOn=true,P={ev:0,iso:100,wb:5500,ct:0},resK=RES[localStorage.getItem('res')]?localStorage.getItem('res'):'4K',baseNote='';
const note=t=>$('camNote').textContent=t;
$('bRes').textContent='📐 '+resK;$('bRes').onclick=()=>{resK=resK==='FHD'?'4K':resK==='4K'?'8K':'FHD';localStorage.setItem('res',resK);$('bRes').textContent='📐 '+resK;if(stream)startCam()};

function readCameraCaps(){
 try{camCaps=track&&track.getCapabilities?track.getCapabilities():{}}catch(_){camCaps={}}
 const rows=[['pEV','oEV','exposureCompensation','EV'],['pISO','oISO','iso','ISO'],['pWB','oWB','colorTemperature','WB']];
 hardwareEV=!!camCaps.exposureCompensation;
 rows.forEach(([input,out,key,label])=>{
  const el=$(input),cap=camCaps[key],supported=!!(cap&&typeof cap.min==='number'&&typeof cap.max==='number');
  el.disabled=!supported;
  el.title=supported?`${label} phần cứng: ${cap.min}–${cap.max}`:`Thiết bị/trình duyệt không hỗ trợ điều khiển ${label} thật`;
  if(supported){el.min=cap.min;el.max=cap.max;if(key==='exposureCompensation')el.step=cap.step||.1;else el.step=key==='iso'?Math.max(1,cap.step||50):Math.max(50,cap.step||100);
   P[key==='exposureCompensation'?'ev':key==='iso'?'iso':'wb']=clamp(P[key==='exposureCompensation'?'ev':key==='iso'?'iso':'wb'],cap.min,cap.max);
  }
  $(out).textContent=el.disabled?'N/A':String(P[key==='exposureCompensation'?'ev':key==='iso'?'iso':'wb']);
 });
 $('camNote').textContent += ` · Điều khiển thật: EV ${hardwareEV?'có':'không'}, ISO ${camCaps.iso?'có':'không'}, WB ${camCaps.colorTemperature?'có':'không'}`;
 syncPro();
 if(camCaps.iso)applyRealCameraControl('iso',P.iso);
 if(camCaps.colorTemperature)applyRealCameraControl('colorTemperature',P.wb);
 if(hardwareEV)applyRealCameraControl('exposureCompensation',P.ev);
}
async function applyRealCameraControl(key,value){
 if(!track||!camCaps[key])return false;
 try{await track.applyConstraints({advanced:[{[key]:value}]});return true}catch(_){return false}
}

let tt=0;setInterval(()=>{if(stream)return;const c=demo.getContext('2d'),w=480,h=640,g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#5b8def');g.addColorStop(.55,'#ffb27a');g.addColorStop(1,'#2d3b2a');c.fillStyle=g;c.fillRect(0,0,w,h);const x=170+Math.sin(tt)*50;c.fillStyle='#e8d7c3';c.beginPath();c.arc(x,260,38,0,7);c.fill();c.fillRect(x-30,300,60,150);c.fillStyle='#222';c.beginPath();c.arc(x-12,254,4,0,7);c.arc(x+12,254,4,0,7);c.fill();tt+=.04},60);
async function startCam(){try{stream&&stream.getTracks().forEach(t=>t.stop());F.on=false;sg.p=null;sg.hold=0;const R=RES[resK];
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:R.w},height:{ideal:R.h}},audio:false});
 vid.srcObject=stream;await vid.play();vid.style.display='block';demo.style.display='none';track=stream.getVideoTracks()[0];
 ic=window.ImageCapture?new ImageCapture(track):null;photoCaps=null;if(ic)try{photoCaps=await ic.getPhotoCapabilities()}catch(_){}
 await detectLenses();const st=track.getSettings(),actualW=st.width||vid.videoWidth,actualH=st.height||vid.videoHeight;
 const hi=photoCaps&&photoCaps.imageWidth&&photoCaps.imageHeight?` · ảnh tĩnh tối đa ${photoCaps.imageWidth.max}×${photoCaps.imageHeight.max}`:'';
 const meets=Math.max(actualW,actualH)>=R.w&&Math.min(actualW,actualH)>=R.h;
 baseNote=`Yêu cầu ${resK} · luồng thực tế ${actualW}×${actualH}${hi}${meets?'':' · camera không đạt độ phân giải yêu cầu'}`;note(baseNote);readCameraCaps()}
 catch(e){note('Không mở được camera (quyền bị chặn?). Đang dùng cảnh mẫu – bạn vẫn có thể thử khung hình AI.')}}
/* Tele / không tele: dò thấu kính thật, thiếu thì dùng zoom phần cứng, rồi zoom số */
async function detectLenses(){const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'),cap=track.getCapabilities?track.getCapabilities():{};
 const find=re=>devs.find(d=>re.test(d.label));const uw=find(/ultra|0\.5|0,5/i),tele=find(/tele|3x|5x|zoom/i);
 lenses=[];if(uw)lenses.push({z:.6,dev:uw.deviceId,t:'0.6'});lenses.push({z:1,t:'1×'});
 const hz=cap.zoom?cap.zoom.max:1;
 [2,3,5].forEach(z=>{if(z===3&&tele)lenses.push({z:3,dev:tele.deviceId,t:'3×',tele:1});else lenses.push({z,hw:hz>=z,t:z+'×'})});

$('lens').onclick=async e=>{const i=e.target.dataset.i;if(i==null)return;const l=lenses[i];document.querySelectorAll('#lens button').forEach(b=>b.classList.toggle('on',b===e.target));curLens=l.z;digital=1;F.on=false;sg.p=null;

 for(let i=0;i<o.N;i++){note(`${o.label} ${i+1}/${o.N} – giữ yên máy…`);if(i){await nextFrame(s);if(o.skip)await nextFrame(s)}
  x.drawImage(s,...cr,0,0,w,h);const d=x.getImageData(0,0,w,h).data;
  if(!d0){d0=d;g0=lumaGrid(d0,w,h,ds);refP=new Uint8Array(P*P);for(let y=0;y<P;y++)for(let xx=0;xx<P;xx++){const p=((py+y)*w+px+xx)<<2;refP[y*P+xx]=(77*d0[p]+151*d0[p+1]+28*d0[p+2])>>8}
   for(let j=0;j<n;j++){acc[j*3]=d0[j<<2];acc[j*3+1]=d0[(j<<2)+1];acc[j*3+2]=d0[(j<<2)+2]}used=1;continue}
  const[bx,by]=align1(g0,lumaGrid(d,w,h,ds),10),[rx,ry,mad]=refine(refP,P,d,w,h,px,py,bx*ds,by*ds,ds);
  if(mad<=o.maxMad){accum(acc,d0,d,w,h,rx,ry,o.thr);used++}await tick()}
 const out=x.createImageData(w,h),od=out.data;for(let j=0;j<n;j++){const a=j*3,p=j<<2;od[p]=acc[a]/used;od[p+1]=acc[a+1]/used;od[p+2]=acc[a+2]/used;od[p+3]=255}
 d0=null;await cleanup(out,w,h,o);x.putImageData(out,0,0);return{c,used}}

/* ---------- Chụp: độ phân giải cao · giảm nhiễu · chụp đêm xếp chồng khung ---------- */
let busy=false;const tick=()=>new Promise(r=>setTimeout(r,0));
const nextFrame=s=>Promise.race([new Promise(r=>s.requestVideoFrameCallback?s.requestVideoFrameCallback(()=>r()):setTimeout(r,70)),new Promise(r=>setTimeout(r,250))]);
function meanLuma(s){sx.drawImage(s,0,0,96,128);const d=sx.getImageData(0,0,96,128).data;let m=0;for(let i=0;i<d.length;i+=4)m+=.3*d[i]+.59*d[i+1]+.11*d[i+2];return m/(d.length/4)}
const hiOK=()=>!!(ic&&photoCaps&&photoCaps.imageWidth&&photoCaps.imageWidth.max>(track.getSettings().width||0)*1.15);
async function hiResShot(cr,R){const pc=photoCaps,Wv=vid.videoWidth,Hv=vid.videoHeight;
 const targetW=R.cap,targetH=Math.round(R.cap*Hv/Wv);
 const iw=clamp(targetW,pc.imageWidth.min,pc.imageWidth.max),ih=clamp(targetH,pc.imageHeight.min,pc.imageHeight.max);
 const blob=await ic.takePhoto({imageWidth:iw,imageHeight:ih}),im=await createImageBitmap(blob,{imageOrientation:'from-image'});
 if(Math.abs(im.width/im.height-Wv/Hv)>.03)throw Error('lệch tỉ lệ');
 const f=im.width/Wv,sw=cr[2]*f,sh=cr[3]*f,k=Math.min(1,R.cap/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,cr[0]*f,cr[1]*f,sw,sh,0,0,w,h);return c}
function adjust(c){const b=hardwareEV?1:Math.pow(2,P.ev),ct=1+P.ct/100;if(Math.abs(b-1)<.01&&Math.abs(ct-1)<.01)return c;const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;const x=c2.getContext('2d');x.filter=`brightness(${b}) contrast(${ct})`;x.drawImage(c,0,0);return c2}
$('shut').onclick=async()=>{if(busy)return;busy=true;$('shut').style.opacity=.5;
 try{const s=src(),R=RES[resK],cr=crop(s),L=Math.max(cr[2],cr[3]);let k=Math.min(1,R.cap/L),cv,info='';
  if(mode==='night'&&stream){k=Math.min(k,Math.sqrt(12.7e6/(cr[2]*cr[3])));const N=cr[2]*cr[3]*k*k>9e6?6:8,r=await stackShot(s,cr,k,{N,label:'Chụp đêm',skip:1,maxMad:35,thr:50,rc:4,T1:18,s1:2,T2:10,s2:1,tone:1,cs:1.12});cv=r.c;info=`xếp chồng ${r.used}/${N} khung`}
  else{if(stream&&hiOK()&&R.cap>2200){try{cv=await hiResShot(cr,R);info='ảnh tĩnh gốc cảm biến'}catch(_){cv=null}}
   if(!cv){if(stream&&meanLuma(s)<80){k=Math.min(k,Math.sqrt(12.7e6/(cr[2]*cr[3])));const r=await stackShot(s,cr,k,{N:3,label:'Thiếu sáng',maxMad:30,thr:44,rc:2,T1:8,s1:1});cv=r.c;info=`cảnh tối: gộp ${r.used}/3 khung`}
    else{const w=Math.round(cr[2]*k),h=Math.round(cr[3]*k);cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(s,...cr,0,0,w,h)}}
   cv=adjust(cv)}
  note('Đang lưu…');await tick();const b=await blobOf(cv,.95),id=Date.now(),w=cv.width,h=cv.height;
  await dbPut({id,t:id,orig:b,cur:b,thumb:await thumbOf(b),p:null,src:'camera',mode});$('thumb').style.backgroundImage=`url(${URL.createObjectURL(b)})`;
  note(`Đã lưu ${w}×${h} (${(w*h/1e6).toFixed(1)}MP)${info?' · '+info:''}`);$('vf').style.opacity=.4;setTimeout(()=>$('vf').style.opacity=1,100);if(navigator.vibrate)navigator.vibrate(20)}
 catch(e){note('Lỗi chụp: '+e.message)}finally{busy=false;$('shut').style.opacity=1}};
$('thumb').onclick=()=>go('gal');

/* ---------- THƯ VIỆN ---------- */
async function loadGal(){const a=(await dbAll()).sort((x,y)=>y.t-x.t),g=$('galBody');if(!a.length){g.innerHTML='<div class="empty">Chưa có ảnh. Chụp hoặc nhập ảnh từ máy.</div>';return}
 const days={};a.forEach(p=>{(days[new Date(p.t).toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric'})]??=[]).push(p)});
 g.innerHTML=Object.entries(days).map(([d,l])=>`<div class="day">${d}</div><div class="grid">${l.map(p=>`<div data-id="${p.id}" style="background-image:url(${p.thumb})">${p.p?'<span>✎</span>':''}</div>`).join('')}</div>`).join('')}
let viewerPhotoId=null;
async function showPhotoPreview(id){
 const photo=await dbGet(id);if(!photo)return;
 viewerPhotoId=id;
 const blob=photo.cur||photo.orig;
 $('vImg').src=URL.createObjectURL(blob);
 $('vInfo').textContent=`Ảnh ${photo.p?'đã chỉnh sửa':'gốc'} · chọn “Chỉnh sửa ảnh” nếu muốn mở Studio`;
 $('imgViewer').classList.add('on');$('imgViewer').setAttribute('aria-hidden','false');
}
function closePhotoPreview(){
 $('imgViewer').classList.remove('on');$('imgViewer').setAttribute('aria-hidden','true');
 $('vImg').removeAttribute('src');viewerPhotoId=null;
}
$('galBody').onclick=e=>{
 const tile=e.target.closest('[data-id]');
 if(!tile)return;
 const id=+tile.dataset.id;
 if(window.matchMedia('(max-width: 780px)').matches)openStudio(id);
 else showPhotoPreview(id);
};
$('vClose').onclick=closePhotoPreview;
$('imgViewer').onclick=e=>{if(e.target===$('imgViewer'))closePhotoPreview()};
$('vEdit').onclick=()=>{if(viewerPhotoId!==null){const id=viewerPhotoId;closePhotoPreview();openStudio(id)}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('imgViewer').classList.contains('on'))closePhotoPreview()});
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=async e=>{
 const files=[...e.target.files];let newestId=null;
 for(const f of files){const id=Date.now()+Math.random()*1000|0;newestId=id;await dbPut({id,t:f.lastModified||id,orig:f,cur:f,thumb:await thumbOf(f),p:null,src:'import'})}
 e.target.value='';loadGal();
 if(newestId!==null&&window.matchMedia('(max-width: 780px)').matches)openStudio(newestId);
};
$('bExp').onclick=async()=>{for(const p of await dbAll()){const a=document.createElement('a');a.href=URL.createObjectURL(p.cur);a.download='aps-'+p.id+'.jpg';a.click();await new Promise(r=>setTimeout(r,250))}};

/* ---------- STUDIO: chỉnh sửa không phá huỷ ---------- */
const SL=[['ex','Phơi sáng',-3,3,.05,0,'L'],['ct','Tương phản',-100,100,1,0,'L'],['hl','Vùng sáng',-100,100,1,0,'L'],['sh','Vùng tối',-100,100,1,0,'L'],['tp','Nhiệt độ',-100,100,1,0,'C'],['sa','Bão hoà',-100,100,1,0,'C'],['vg','Viền tối',0,100,1,0,'C']];
let cur=null,E={},base=null,orig2=null;
SL.forEach(s=>$('sl'+s[6]).insertAdjacentHTML('beforeend',`<div class="sl"><span>${s[1]}</span><input type="range" id="e_${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${s[5]}"><output id="o_${s[0]}">0</output></div>`));
SL.forEach(s=>$('e_'+s[0]).oninput=()=>{E[s[0]]=+$('e_'+s[0]).value;$('o_'+s[0]).textContent=E[s[0]];queue()});
const zero=()=>Object.fromEntries(SL.map(s=>[s[0],0]));
function setE(o){E={...zero(),...o};SL.forEach(s=>{$('e_'+s[0]).value=E[s[0]];$('o_'+s[0]).textContent=E[s[0]]})}
async function openStudio(id){cur=await dbGet(id);if(!cur)return;cmp=false;$('cvO').style.display='none';$('tagB').style.display='none';$('cmpR').style.display='none';const im=await bmp(cur.orig),k=Math.min(1,1400/Math.max(im.width,im.height)),w=im.width*k|0,h=im.height*k|0;
 for(const c of [$('cvA'),$('cvO')]){c.width=w;c.height=h}$('cvO').getContext('2d').drawImage(im,0,0,w,h);const a=$('cvA').getContext('2d');a.drawImage(im,0,0,w,h);base=a.getImageData(0,0,w,h);
 $('stEmpty').style.display='none';$('stk').style.display='block';setE(cur.p||{});go('stu');render()}
function proc(src,dst,e,vgOn=true){const s=src.data,d=dst.data,w=src.width,h=src.height,ex=Math.pow(2,e.ex),c=1+e.ct/100,sa=1+e.sa/100,t=e.tp/100*30,hl=e.hl/100*.6,sh=e.sh/100*.6,vg=e.vg/100;
 for(let i=0,p=0;i<s.length;i+=4,p++){let r=s[i]*ex+t,g=s[i+1]*ex,b=s[i+2]*ex-t;const y=.3*r+.59*g+.11*b,n=y/255;
  const dl=n>.5?-hl*(n-.5)*2*255*.5:sh*(.5-n)*2*255*.5;r+=dl;g+=dl;b+=dl;
  r=(r-128)*c+128;g=(g-128)*c+128;b=(b-128)*c+128;const l=.3*r+.59*g+.11*b;r=l+(r-l)*sa;g=l+(g-l)*sa;b=l+(b-l)*sa;
  if(vg&&vgOn){const x=(p%w)/w-.5,yy=((p/w)|0)/h-.5,f=1-vg*Math.min(1,(x*x+yy*yy)*2.2);r*=f;g*=f;b*=f}
  d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255}}
let q=0;const queue=()=>{if(!q)q=requestAnimationFrame(()=>{q=0;render()})};
function render(){if(!base)return;const c=$('cvA'),x=c.getContext('2d'),o=x.createImageData(base.width,base.height);proc(base,o,E);x.putImageData(o,0,0)}
let cmp=false;$('sCmp').onclick=()=>{cmp=!cmp;$('cvO').style.display=cmp?'block':'none';$('tagB').style.display=cmp?'block':'none';$('cmpR').style.display=cmp?'block':'none';$('cvO').style.clipPath=`inset(0 ${100-$('cmpR').value}% 0 0)`};
$('cmpR').oninput=e=>{$('cvO').style.clipPath=`inset(0 ${100-e.target.value}% 0 0)`;$('tagB').style.left='8px'};
$('sRst').onclick=()=>{setE({});render()};
/* Tự chỉnh AI (cục bộ: phân tích histogram → thông số kiểu Lightroom Auto) */
$('sAuto').onclick=()=>{if(!base)return;const d=base.data,n=d.length/4;let m=0,v=0,hi=0,lo=0,R=0,B=0;for(let i=0;i<d.length;i+=4){const y=.3*d[i]+.59*d[i+1]+.11*d[i+2];m+=y;R+=d[i];B+=d[i+2];if(y>245)hi++;if(y<10)lo++}m/=n;for(let i=0;i<d.length;i+=4){const y=.3*d[i]+.59*d[i+1]+.11*d[i+2];v+=(y-m)**2}v=Math.sqrt(v/n);
 setE({ex:+clamp(Math.log2(118/m)*.8,-1.5,1.5).toFixed(2),ct:clamp(Math.round((58-v)*1.2),-30,40),hl:hi/n>.03?-50:-15,sh:lo/n>.05||m<100?45:20,tp:clamp(Math.round((B/R-1)*60),-25,25),sa:18,vg:12});render()};
/* Lưu / tải */
async function fullRender(){const im=await bmp(cur.orig),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);const s=x.getImageData(0,0,c.width,c.height),o=x.createImageData(c.width,c.height);proc(s,o,E);x.putImageData(o,0,0);return blobOf(c)}
$('sSave').onclick=async()=>{if(!cur)return;const b=await fullRender();cur.cur=b;cur.p={...E};cur.thumb=await thumbOf(b);await dbPut(cur);$('gMsg').textContent='Đã lưu – ảnh gốc vẫn được giữ nguyên, bấm ↺ Gốc để quay lại.'};
$('sDl').onclick=async()=>{if(!cur)return;const a=document.createElement('a');a.href=URL.createObjectURL(await fullRender());a.download='aps-edit-'+cur.id+'.jpg';a.click()};
/* Gemini: gợi ý thông số & tạo ảnh (cần chạy ngoài môi trường trang đã publish) */
// Gemini API key: không nhúng hoặc lưu khóa bí mật trong mã HTML phía trình duyệt.
$('gKey').value = '';
$('gKey').onchange = () => {};
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
async function gem(model,parts,cfg){const k=$('gKey').value;if(!k)throw Error('Hãy nhập Gemini API key');const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:cfg})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return j}
$('gAdj').onclick=async()=>{if(!cur)return;$('gMsg').textContent='Gemini đang phân tích…';try{const j=await gem('gemini-2.5-flash',[{inline_data:{mime_type:'image/jpeg',data:await b64(cur.orig)}},{text:`Bạn là nhiếp ảnh gia chuyên nghiệp. ${$('gPr').value||'Chỉnh ảnh đẹp tự nhiên.'} Trả về JSON với các khoá ex(-3..3),ct,hl,sh,tp,sa(-100..100),vg(0..100).`}],{responseMimeType:'application/json'});
 setE(JSON.parse(j.candidates[0].content.parts[0].text));render();$('gMsg').textContent='Đã áp dụng thông số từ Gemini.'}catch(e){$('gMsg').textContent='Lỗi: '+e.message}};
$('gGen').onclick=async()=>{if(!cur)return;$('gMsg').textContent='Gemini đang tạo ảnh…';try{const j=await gem('gemini-2.5-flash-image',[{text:$('gPr').value||'Cải thiện ảnh chuyên nghiệp'},{inline_data:{mime_type:'image/jpeg',data:await b64(cur.orig)}}]);
 const p=j.candidates[0].content.parts.find(p=>p.inlineData||p.inline_data),d=(p.inlineData||p.inline_data).data,bin=atob(d),u=new Uint8Array(bin.length).map((_,i)=>bin.charCodeAt(i));
 const b=new Blob([u],{type:'image/png'}),id=Date.now();await dbPut({id,t:id,orig:b,cur:b,thumb:await thumbOf(b),p:null,src:'gemini'});$('gMsg').textContent='Ảnh AI đã được lưu thành bản mới trong Thư viện (ảnh gốc không đổi).'}catch(e){$('gMsg').textContent='Lỗi: '+e.message}};

startCam();
</script></body></html>
